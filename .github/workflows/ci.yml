name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  api:
    name: API quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-tcc-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-tcc-pro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint . --config eslint.config.cjs

      - name: Build
        run: npm run build

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - frontend
          - api-tcc-pro
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          if [ "${{ matrix.project }}" = "api-tcc-pro" ]; then
            npm audit --omit=dev --audit-level=high
          else
            npm audit --audit-level=high
          fi

  secrets:
    name: Scan committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | awk '
            /(^|\/)\.env($|\.)/ && $0 !~ /\.(example|sample|template)$/ { print }
          ')
          if [[ -n "$forbidden" ]]; then
            echo "Tracked environment files are not allowed:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

